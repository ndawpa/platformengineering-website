services:
  app:
    container_name: docker-secure-app
    build: .
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    ports: ["127.0.0.1:8080:8080"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8080"], interval: 2s, timeout: 1s, retries: 10 }
