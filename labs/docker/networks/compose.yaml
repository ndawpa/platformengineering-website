services:
  api:
    image: busybox:1.37.0
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    volumes: ["./www:/www:ro"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8080"], interval: 2s, timeout: 1s, retries: 10 }
    networks: [backend]
  client:
    image: busybox:1.37.0
    command: ["sleep", "3600"]
    depends_on: { api: { condition: service_healthy } }
    networks: [backend]
networks: { backend: {} }
