apiVersion: v1
kind: Namespace
metadata: { name: pe-rbac }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: viewer, namespace: pe-rbac }
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: pod-viewer, namespace: pe-rbac }
rules: [{ apiGroups: [""], resources: [pods], verbs: [get] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: pod-viewer, namespace: pe-rbac }
subjects: [{ kind: ServiceAccount, name: viewer, namespace: pe-rbac }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: pod-viewer }
