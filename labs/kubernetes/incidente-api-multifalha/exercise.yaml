apiVersion: v1
kind: Namespace
metadata: { name: pe-incident }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: api-config, namespace: pe-incident }
data:
  APP_ENV: production
  index.html: "API operacional\n"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: pe-incident }
spec:
  replicas: 2
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api, tier: backend } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: busybox:1.37.0
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          env:
            - name: API_ENDPOINT
              valueFrom: { configMapKeyRef: { name: api-config, key: API_ENDPOINT } }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 3, failureThreshold: 2 }
          livenessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10 }
          volumeMounts: [{ name: content, mountPath: /www, readOnly: true }]
          resources: { requests: { cpu: 20m, memory: 24Mi }, limits: { cpu: 100m, memory: 64Mi } }
      volumes: [{ name: content, configMap: { name: api-config, items: [{ key: index.html, path: index.html }] } }]
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: pe-incident }
spec:
  selector: { component: backend }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: Pod
metadata: { name: client, namespace: pe-incident }
spec:
  automountServiceAccountToken: false
  containers: [{ name: client, image: busybox:1.37.0, command: ["sleep", "3600"] }]
