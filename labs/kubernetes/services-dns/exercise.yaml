apiVersion: v1
kind: Namespace
metadata: { name: pe-network }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: page, namespace: pe-network }
data: { index.html: "Service funcionando\n" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: pe-network }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: web
          image: nginx:1.28-alpine
          volumeMounts: [{ name: page, mountPath: /usr/share/nginx/html, readOnly: true }]
      volumes: [{ name: page, configMap: { name: page } }]
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: pe-network }
spec:
  selector: { app: api-broken }
  ports: [{ name: http, port: 80, targetPort: 80 }]
---
apiVersion: v1
kind: Pod
metadata: { name: client, namespace: pe-network }
spec:
  containers: [{ name: client, image: busybox:1.37.0, command: ["sleep", "3600"] }]
