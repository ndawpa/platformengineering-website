apiVersion: v1
kind: Namespace
metadata: { name: pe-config }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: app-config, namespace: pe-config }
data: { APP_ENV: lab, index.html: "API configurada pelo ConfigMap\n" }
---
apiVersion: v1
kind: Secret
metadata: { name: app-secret, namespace: pe-config }
type: Opaque
stringData: { API_TOKEN: lab-only-not-a-real-secret }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: config-api, namespace: pe-config }
spec:
  replicas: 1
  selector: { matchLabels: { app: config-api } }
  template:
    metadata: { labels: { app: config-api } }
    spec:
      containers:
        - name: web
          image: nginx:1.28-alpine
          envFrom: [{ configMapRef: { name: app-config } }, { secretRef: { name: app-secret } }]
          volumeMounts: [{ name: content, mountPath: /usr/share/nginx/html, readOnly: true }]
          readinessProbe: { httpGet: { path: /health-does-not-exist, port: 80 }, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 10 }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
      volumes: [{ name: content, configMap: { name: app-config, items: [{ key: index.html, path: index.html }] } }]
