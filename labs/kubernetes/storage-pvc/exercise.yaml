apiVersion: v1
kind: Namespace
metadata: { name: pe-storage }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: data, namespace: pe-storage }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 100Mi } }
---
apiVersion: v1
kind: Pod
metadata: { name: writer, namespace: pe-storage }
spec:
  containers:
    - name: writer
      image: busybox:1.37.0
      command: ["sh", "-c", "echo persistente > /data/message.txt; sleep 3600"]
      volumeMounts: [{ name: data, mountPath: /data }]
  volumes: [{ name: data, persistentVolumeClaim: { claimName: data } }]
