name: Helm

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Chart version (for example 0.1.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint charts/platformengineering --strict
      - name: Render defaults
        run: helm template platformengineering charts/platformengineering --namespace platformengineering
      - name: Render optional resources
        run: >-
          helm template platformengineering charts/platformengineering
          --namespace platformengineering
          --set ingress.enabled=true
          --set autoscaling.enabled=true
          --set podDisruptionBudget.enabled=true
          --set networkPolicy.enabled=true

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Package
        run: >-
          helm package charts/platformengineering
          --destination .helm-packages
          --version "${{ steps.version.outputs.value }}"
          --app-version "${{ steps.version.outputs.value }}"
      - name: Push OCI chart
        run: helm push ".helm-packages/platformengineering-${{ steps.version.outputs.value }}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
